# Optional: Include this file to run Anna's Archive addon alongside Golden Library
# Usage: docker-compose -f docker-compose.yml -f docker-compose.addon.yml up

version: '3.8'

services:
  # This extends the main docker-compose.yml services
  # Just add the addon service here

  annas-archive-addon:
    build:
      context: ../js-adon/addons/annas-archive
      dockerfile: Dockerfile
    ports:
      - '4301:4301'
    environment:
      NODE_ENV: development
      PORT: 4301
      # Change mirror if needed
      ANNAS_ARCHIVE_URL: https://annas-archive.org
    restart: unless-stopped
    labels:
      - 'io.peterbaikov.addon=annas-archive'
      - 'io.peterbaikov.addon.version=1.0.0'
    # Connect to the same network as other services (if they're in docker-compose.yml)
    networks:
      - default
