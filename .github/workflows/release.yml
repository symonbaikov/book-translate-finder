name: Release

# Publishes multi-arch images to GHCR on a semantic-version tag push (docs/architecture.md §9.1).
# Deliberately builds only api/worker/migrate, NOT web: Next.js inlines NEXT_PUBLIC_* into the
# browser bundle at build time, so a generically-published web image would only be correct for
# whatever API URL happened to be baked in at CI time — every self-hoster needs their own domain,
# which is exactly why docker-compose.yml builds web locally instead of pulling it (see that
# file's own comment, and the NEXT_PUBLIC_API_URL note in .env.example).

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/golden-library

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Select Dockerfile
        id: dockerfile
        # api/worker share docker/app.Dockerfile (selected via APP_NAME); migrate has its own,
        # narrower build (just packages/domain+application+infrastructure, no app package).
        run: |
          if [ "${{ matrix.app }}" = "migrate" ]; then
            echo "path=docker/migrate.Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=docker/app.Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: |
            APP_NAME=${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
